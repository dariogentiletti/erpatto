# Every push and pull request runs the Lua tests (WoW API stubs + Lua 5.1 through lupa).
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Run tests
        working-directory: tests
        run: |
          fail=0
          for t in test_model test_state test_comms test_tracker test_ui; do
            echo "== $t"
            out=$(python3 $t.py 2>&1) || { echo "$out"; fail=1; continue; }
            echo "$out" | grep -E "^FAIL|failures" || true
            if echo "$out" | grep -q "^FAIL"; then fail=1; fi
          done
          exit $fail
