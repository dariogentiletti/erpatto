# Pushing a tag like v0.9.6 builds the zip and uploads it to CurseForge (and to GitHub Releases).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # retail versions for now, so the addon can be tried on the live client before Forever opens;
      # switch to 1.60.1 (WoW Forever) when testing moves there
      - uses: BigWigsMods/packager@v2
        with:
          args: -g "12.1.5,12.1.0"
