# A release builds the zip and uploads it to CurseForge (and to GitHub Releases). Two ways to start one:
#  - pushing a tag like v1.0.0;
#  - pushing to main a commit whose message says [release v1.0.0]: the job makes the tag itself, then builds.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v')
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # tag pushes: the packager as an action
      - uses: BigWigsMods/packager@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          args: -g "1.60.1,12.1.5,12.1.0"
      # a commit with [release vX.Y.Z]: make the tag (if it isn't there yet), then run the packager as if the tag
      # had been pushed (a tag pushed by the job itself starts no other run)
      - name: Tag from the commit message and package
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          v=$(printf '%s' "$MSG" | grep -o '\[release v[0-9][0-9.]*\]' | head -1 | sed -E 's/\[release (v[0-9.]+)\]/\1/')
          if [ -z "$v" ]; then echo "no version in the message"; exit 1; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            git tag -a "$v" -m "Er Patto $v"
            git push origin "$v"
          fi
          git checkout -q "$v"
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o /tmp/release.sh
          GITHUB_REF="refs/tags/$v" GITHUB_REF_NAME="$v" GITHUB_REF_TYPE=tag bash /tmp/release.sh -g "1.60.1,12.1.5,12.1.0"
